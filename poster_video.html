<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Poster & Video - UGV Portfolio</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap');
        :root {
            --bg-page: #9F90CE;
            --bg-card: rgba(245, 245, 220, 0.9);
            --accent-1: #6B5B95;
            --accent-2: #B8860B;
            --text-main: #2D2241;
            --text-muted: #5A4E6E;
            --border-glass: rgba(107, 91, 149, 0.2);
            --shadow-soft: 0 10px 40px rgba(107, 91, 149, 0.15);
            --shadow-vibrant: 0 20px 60px rgba(159, 144, 206, 0.35);
            --gradient-vibrant: linear-gradient(135deg, #6B5B95 0%, #B8860B 100%);
        }
        * { box-sizing:border-box; margin:0; padding:0; }
        body {font-family:'Plus Jakarta Sans',sans-serif;background:var(--bg-page);color:var(--text-main);min-height:100vh;overflow-x:hidden;}
        body::before, body::after { content: ""; position: fixed; width: 800px; height: 800px; border-radius: 50%; filter: blur(150px); z-index: -1; opacity: 0.15; animation: floatBlob 20s infinite alternate ease-in-out; }
        body::before { background: var(--accent-1); top: -200px; left: -200px; }
        body::after { background: var(--accent-2); bottom: -200px; right: -200px; }
        @keyframes floatBlob { 0% { transform: translateY(0px) scale(1); } 100% { transform: translateY(40px) scale(1.1); } }
        
        /* ===== NAVIGATION BAR ===== */
        .nav-bar {
            position: fixed;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 1000;
            background: rgba(245, 245, 220, 0.8);
            backdrop-filter: blur(15px);
            padding: 18px 50px;
            border-radius: 50px;
            border: 1px solid var(--border-glass);
            box-shadow: var(--shadow-soft);
            display: flex;
            gap: 25px;
            transition: all 0.4s ease;
        }

        .nav-bar:hover {
            box-shadow: var(--shadow-vibrant);
            border-color: var(--accent-1);
            background: rgba(245, 245, 220, 0.95);
        }

        .nav-link {
            text-decoration: none;
            color: var(--text-muted);
            font-weight: 700;
            font-size: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            transition: all 0.3s ease;
            position: relative;
        }

        .nav-link:hover,
        .nav-link.active {
            color: var(--accent-1);
        }

        .nav-link::after {
            content: '';
            position: absolute;
            bottom: -5px;
            left: 0;
            width: 0;
            height: 2px;
            background: var(--accent-1);
            transition: width 0.3s ease;
        }

        .nav-link:hover::after,
        .nav-link.active::after {
            width: 100%;
        }
        
        header { padding: 140px 20px 60px; text-align: center; background: rgba(245, 245, 220, 0.92); backdrop-filter: blur(20px); border-bottom: 1px solid var(--border-glass); }
        header h1 { font-size: clamp(2.2rem, 4vw, 3.2rem); margin: 0; background: var(--gradient-vibrant); -webkit-background-clip: text; background-clip: text; -webkit-text-fill-color: transparent; }
        
        .container { max-width: 1300px; margin: 0 auto; padding: 60px 20px 100px; }
        
        .tab-nav { display: flex; gap: 16px; justify-content: center; margin-bottom: 40px; }
        .tab-btn { padding: 12px 32px; border: 2px solid var(--accent-1); background: transparent; color: var(--accent-1); border-radius: 30px; font-family: 'Plus Jakarta Sans', sans-serif; font-weight: 700; font-size: 1rem; cursor: pointer; transition: 0.3s; }
        .tab-btn.active, .tab-btn:hover { background: var(--gradient-vibrant); color: #fff; border-color: transparent; box-shadow: 0 4px 20px rgba(107, 91, 149, 0.3); }
        
        .tab-panel { display: none; }
        .tab-panel.active { display: block; animation: fadeIn 0.4s ease-out forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        
        .section-card { background: var(--bg-card); border: 1px solid var(--border-glass); border-radius: 28px; padding: 45px; box-shadow: var(--shadow-soft); text-align: center; transition: box-shadow 0.3s ease; }
        .section-card:hover { box-shadow: var(--shadow-vibrant); }
        .section-title { font-size: 2rem; font-weight: 800; color: var(--accent-1); margin-bottom: 30px; }
        
        /* PDF and Video Embed Container */
        .media-container {
            border-radius: 15px;
            overflow: hidden;
            border: 2px solid var(--border-glass);
            box-shadow: var(--shadow-soft);
            background: #fff;
            max-width: 1000px;
            margin: 0 auto;
        }

        .video-container {
            background: #000;
            max-width: 1000px;
            margin: 0 auto;
            border-radius: 15px;
            overflow: hidden;
            border: 2px solid var(--border-glass);
            box-shadow: var(--shadow-soft);
        }

        video {
            display: block;
            width: 100%;
            max-height: 600px;
        }

        .action-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 14px 36px;
            background: var(--gradient-vibrant);
            color: #fff;
            text-decoration: none;
            border-radius: 30px;
            font-weight: 700;
            font-size: 1rem;
            border: none;
            cursor: pointer;
            box-shadow: 0 4px 20px rgba(107, 91, 149, 0.3);
            transition: all 0.3s ease;
        }
        .action-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 8px 30px rgba(184, 134, 11, 0.4);
            color: #fff;
        }

        @media (max-width: 900px) {
            .nav-bar {
                width: 95%;
                padding: 10px 12px;
                gap: 10px;
                border-radius: 25px;
                flex-wrap: wrap;
                justify-content: center;
                top: 15px;
            }

            .nav-link {
                font-size: 0.75rem;
            }
        }

        @media (max-width: 480px) {
            .nav-bar {
                top: 10px;
            }
        }
    </style>
</head>
<body>

<nav class="nav-bar">
    <a href="index.html" class="nav-link">Home</a>
    <a href="theme.html" class="nav-link">Theme</a>
    <a href="title.html" class="nav-link">Title</a>
    <a href="problem_identification.html" class="nav-link">Problem Identification</a>
    <a href="engineering_design.html" class="nav-link">Engineering Design</a>
    <a href="system_architecture.html" class="nav-link">System Architecture</a>
    <a href="detailed_design.html" class="nav-link">Detailed Design</a>
    <a href="poster_video.html" class="nav-link active">Poster & Video</a>
</nav>

<header>
    <h1>Project Poster & Video</h1>
</header>

<div class="container">
    <div class="tab-nav">
        <button class="tab-btn active" onclick="showTab('poster', this)">Project Poster</button>
        <button class="tab-btn" onclick="showTab('video', this)">Project Video</button>
    </div>

    <!-- Poster Tab Panel -->
    <div id="poster" class="tab-panel active">
        <div class="section-card">
            <h2 class="section-title">Team 13 Project Poster</h2>
            <div class="media-container">
                <object data="Team 13 Poster.pdf" type="application/pdf" width="100%" height="800px">
                    <iframe src="Team 13 Poster.pdf" width="100%" height="800px" style="border: none;">
                        <p>Your browser does not support inline PDF viewing. You can download the PDF file below.</p>
                    </iframe>
                </object>
            </div>
            <div style="margin-top: 30px;">
                <a href="Team 13 Poster.pdf" download class="action-btn">
                    <span>📥 Download Poster PDF</span>
                </a>
            </div>
        </div>
    </div>

    <!-- Video Tab Panel -->
    <div id="video" class="tab-panel">
        <div class="section-card">
            <h2 class="section-title">Project Video Demonstration</h2>
            <div class="video-container">
                <video controls preload="metadata">
                    <source src="Team 13 video.mp4" type="video/mp4">
                    Your browser does not support the video tag.
                </video>
            </div>
            <div style="margin-top: 30px;">
                <a href="Team 13 video.mp4" download class="action-btn">
                    <span>📥 Download Project Video</span>
                </a>
            </div>
        </div>
    </div>
</div>

<script>
function showTab(name, btn) {
    document.querySelectorAll('.tab-panel').forEach(p => p.classList.remove('active'));
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    document.getElementById(name).classList.add('active');
    btn.classList.add('active');
    
    // Pause video when switching away from video tab
    if (name !== 'video') {
        const video = document.querySelector('video');
        if (video) video.pause();
    }
}
</script>

</body>
</html>
